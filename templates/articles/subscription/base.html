{% extends 'articles/base.html' %}
{% load static %}

{% block title %}订阅管理 - {{ block.super }}{% endblock %}

{% block content %}
<div class="subscription-admin">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4><i class="bi bi-envelope-paper"></i> 订阅管理</h4>
    </div>
    
    <!-- 管理导航 -->
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'subscription_admin' %}active{% endif %}" 
               href="{% url 'articles:subscription_admin' %}">
                <i class="bi bi-speedometer2"></i> 数据看板
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'subscription_list' %}active{% endif %}" 
               href="{% url 'articles:subscription_list' %}">
                <i class="bi bi-people"></i> 订阅管理
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'subscription_config' %}active{% endif %}" 
               href="{% url 'articles:subscription_config' %}">
                <i class="bi bi-gear"></i> 发送配置
            </a>
        </li>
    </ul>
    
    {% block admin_content %}{% endblock %}
</div>
{% endblock %}
