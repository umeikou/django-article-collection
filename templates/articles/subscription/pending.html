{% extends 'articles/base.html' %}

{% block title %}请前往邮箱确认 · 于明浩的文章·播客列表{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
        <div class="liquid-glass-panel" style="padding: 3rem 2rem; border-radius: 12px; text-align: center; margin-top: 3rem;">
            <div style="margin-bottom: 1.5rem;">
                <i class="bi bi-envelope-check" style="font-size: 3.5rem; color: var(--text-primary);"></i>
            </div>

            <h2 style="margin: 0 0 12px 0; font-size: 22px; font-weight: 600;">确认邮件已发送</h2>
            <p style="margin: 0 0 32px 0; color: var(--text-secondary); font-size: 15px; line-height: 1.7;">
                我们已向您填写的邮箱发送了一封确认邮件,请在 3 天内点击邮件中的「确认订阅」按钮以完成激活。<br>
                未确认前我们不会向您发送任何其他邮件。
            </p>

            <div style="text-align: left; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px 20px; margin-bottom: 24px;">
                <h6 style="margin: 0 0 12px 0; font-size: 12px; letter-spacing: 0.06em; color: var(--text-secondary); text-transform: uppercase;">没收到邮件?</h6>
                <ul style="margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.8; color: var(--text-primary);">
                    <li>请稍等几分钟,邮件可能略有延迟</li>
                    <li>检查垃圾邮件或广告邮件文件夹</li>
                    <li>如长时间未收到,可回到首页重新提交订阅</li>
                </ul>
            </div>

            <a href="{% url 'articles:index' %}" class="btn btn-outline-accent">
                <i class="bi bi-arrow-left"></i> 返回首页
            </a>
        </div>
    </div>
</div>
{% endblock %}
